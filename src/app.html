<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Reader</title>
    <!--
      Tauri production may open the webview at …/index.html.
      Normalize the URL before SvelteKit boots so the `/` route matches
      (otherwise the installed app shows a blank white window).
    -->
    <script>
      (function () {
        try {
          // Normalize entry URL for SvelteKit router (/ only).
          var path = location.pathname || "";
          if (path === "/index.html" || /\/index\.html$/i.test(path)) {
            history.replaceState(
              null,
              "",
              "/" + (location.search || "") + (location.hash || ""),
            );
          }
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    style="margin:0;min-height:100vh;background:#f4f1ea;color:#1f1a14"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
