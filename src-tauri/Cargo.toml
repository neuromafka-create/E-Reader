[package]
name = "e-reader"
version = "0.1.0"
description = "Desktop e-reader for EPUB, FB2, TXT, Markdown"
authors = ["you"]
edition = "2021"

[lib]
name = "e_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
pulldown-cmark = "0.13"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rbook = { version = "0.7.10", default-features = false, features = ["prelude", "threadsafe"] }
fb2 = "0.4.4"
quick-xml = { version = "0.41.0", features = ["serialize", "encoding"] }
base64 = "0.22.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["rustls", "gzip", "brotli"] }
